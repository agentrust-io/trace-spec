site_name: TRACE
site_description: Trust Runtime Attestation and Compliance Evidence: open attestation standard for agentic AI governance
site_url: https://trace.agentrust-io.com
repo_url: https://github.com/agentrust-io/trace-spec
repo_name: agentrust-io/trace-spec
edit_uri: edit/main/
docs_dir: .
copyright: "© 2026 TRACE Specification contributors: CC BY 4.0"

exclude_docs: |
  .github/
  overrides/
  node_modules/
  src/
  tests/
  # schema/ is published, not excluded, but only the file whose $id points at
  # this host. The others declare an agentrust-io.com $id and are served there;
  # serving a second copy here would give the same document two URLs.
  schema/trace-claim.json
  schema/trace-revocation.json
  schema/trace-revocation-bundle.json
  LICENSE
  NOTICE
  README.md
  ANTITRUST.md
  ADOPTERS.md
  SECURITY.md
  pyproject.toml

theme:
  name: material
  custom_dir: overrides
  font: false
  logo: docs/assets/icon.svg
  favicon: docs/assets/icon.svg
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.path
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
    - toc.follow
    - announce.dismiss
  icon:
    repo: fontawesome/brands/github

plugins:
  - search:
      lang: en
  - llmstxt:
      full_output: llms-full.txt
      markdown_description: >-
        TRACE (Trust Runtime Attestation and Compliance Evidence) is an open
        specification for hardware-attested AI agent governance records. A TRACE
        Trust Record binds what model ran, in which verified hardware
        environment, under which policy, on what data class, and which tools were
        invoked into a single signed artifact rooted in silicon attestation, then
        anchors it to a SCITT transparency ledger so a third party can verify it
        without trusting the operator. It builds on RFC 9711 (CWT/EAT), RFC 9334
        (RATS), and SCITT, and ships a Python library, agentrust-trace, with a
        conformance suite.
      sections:
        Getting started:
          - index.md
          - docs/quickstart.md
          - docs/trust-levels.md
          - docs/verification.md
          - docs/glossary.md
        Specification:
          - spec/trace-v0.2.md
          - docs/schema.md
        Integration:
          - docs/integration/agt.md
          - docs/integration/openshell.md
          - docs/integration/cmcp.md
          - docs/integration/sandbox-runtime.md
        Platforms:
          - docs/platforms/index.md
  - minify:
      minify_html: true
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            unwrap_annotated: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      use_pygments: true
      linenums_style: pymdownx-inline
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.keys
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
      toc_depth: 3

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/agentrust-io/trace-spec
      name: trace-spec on GitHub
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/agentrust-trace/
      name: agentrust-trace on PyPI
    - icon: fontawesome/brands/discord
      link: https://discord.gg/grgzFEHgkj
      name: Join the Discord
  generator: false
  analytics:
    feedback:
      title: Was this page helpful?
      ratings:
        - icon: material/emoticon-happy-outline
          name: This page was helpful
          data: 1
          note: Thanks for your feedback!
        - icon: material/emoticon-sad-outline
          name: This page could be improved
          data: 0
          note: Thanks for your feedback: open an issue to let us know.

extra_css:
  # Shared AgenTrust editorial design system. Deliberately the only stylesheet:
  # a local override here is how this site drifted to the Material default
  # violet last time. Change the shared file instead.
  - https://agentrust-io.com/design-system.css

