name: Conformance publisher

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: Build only, or publish to a verified TestPyPI publisher
        type: choice
        options: [build, testpypi]
        default: build

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'conformance-v')
    uses: ./.github/workflows/conformance-package.yml
  tag:
    if: github.event_name == 'release' && startsWith(github.event.release.tag_name, 'conformance-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Match conformance tag to package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os, tomllib
          from pathlib import Path
          version = tomllib.loads(Path("conformance/pyproject.toml").read_text())["project"]["version"]
          if os.environ["RELEASE_TAG"] != "conformance-v" + version:
              raise SystemExit("Conformance release tag does not match package version")
          PY
  testpypi:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi' && vars.CONFORMANCE_TESTPYPI_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment: conformance-testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: conformance-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
  pypi:
    if: github.event_name == 'release' && startsWith(github.event.release.tag_name, 'conformance-v') && vars.CONFORMANCE_PYPI_ENABLED == 'true'
    needs: [build, tag]
    runs-on: ubuntu-latest
    environment: conformance-pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: conformance-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
