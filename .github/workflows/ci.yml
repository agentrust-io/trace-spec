name: CI

on:
  workflow_call:
  push:
    branches: ["main", "feat/**", "fix/**"]
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev deps
        # Third-party dependencies come from the hash-pinned lock first; the
        # local package then goes in with --no-deps, because pip cannot
        # hash-pin an editable install in the same invocation.
        run: |
          pip install --require-hashes -r requirements/dev.txt
          pip install --no-deps -e .

      - name: Lint
        run: ruff check src tests scripts

      # House style is no em dashes in what we publish. The rule was already
      # stated and the repository still carried 601 of them, because prose
      # review does not catch a dash in a workflow comment or a table cell.
      # examples/ and spec/ are exempt for now; see tools/check_dashes.py.
      - name: House style (no em dashes)
        run: python tools/check_dashes.py

      - name: Type check
        run: mypy src/agentrust_trace

      - name: Test
        run: pytest --cov=agentrust_trace --cov-report=term-missing

      - name: Verifier context replay experiment
        run: pytest -q experiments/verifier-context-replay

      - name: Portability (non-UTF-8 locale and python -OO)
        run: |
          pip install --require-hashes -r conformance/requirements/test.txt
          pip install --no-deps -e conformance
          LC_ALL=C PYTHONUTF8=0 pytest
          LC_ALL=C PYTHONUTF8=0 pytest -c conformance/pyproject.toml conformance/tests
          PYTHONOPTIMIZE=2 pytest tests/test_review_bar.py
          PYTHONOPTIMIZE=2 python tools/check_dashes.py --help
          PYTHONOPTIMIZE=2 python tools/review_bar.py --help
