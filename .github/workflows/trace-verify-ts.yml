name: trace-verify-ts

on:
  push:
    branches: ["main", "feat/**", "fix/**"]
    paths:
      - "trace-verify-ts/**"
      - "schema/**"
      - "examples/**"
      - "src/agentrust_trace/**"
      - ".github/workflows/trace-verify-ts.yml"
  pull_request:
    paths:
      - "trace-verify-ts/**"
      - "schema/**"
      - "examples/**"
      - "src/agentrust_trace/**"
      - ".github/workflows/trace-verify-ts.yml"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  unit:
    name: unit tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The floor is what the package declares (WebCrypto with Ed25519), and
        # the ceiling is current. A runtime that drops out of this matrix is a
        # supported-versions change, not a CI adjustment.
        node-version: ["20", "22", "24"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install
        run: npm ci
        working-directory: trace-verify-ts

      - name: Build and test
        run: npm test
        working-directory: trace-verify-ts

  differential:
    name: differential against the Python implementation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out the published conformance vectors
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: agentrust-io/trace-tests
          # Pinned: the corpus is scored input, so it changes when this workflow
          # says it changes. generate_cases.py writes the SHA-256 of every file
          # it read into build/manifest.json.
          ref: 3af2b53eb2e041918b8a6706a3e5a83f143a7568
          path: .vectors
        continue-on-error: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install
        run: |
          pip install --require-hashes -r requirements/dev.txt
          pip install --no-deps -e .
          npm ci --prefix trace-verify-ts

      - name: Lint the harness
        run: ruff check trace-verify-ts/differential

      - name: Build the verifier
        run: npm run build --prefix trace-verify-ts

      - name: Generate the corpus
        run: |
          if [ -d .vectors/tests/vectors ]; then
            python differential/generate_cases.py --external "$GITHUB_WORKSPACE/.vectors/tests/vectors"
          else
            python differential/generate_cases.py
          fi
        working-directory: trace-verify-ts

      - name: Run both implementations and compare
        run: |
          python differential/oracle.py
          node differential/run.mjs
          python differential/compare.py --report differential/build/report.json
        working-directory: trace-verify-ts

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: differential-report
          path: trace-verify-ts/differential/build/report.json
          if-no-files-found: ignore
