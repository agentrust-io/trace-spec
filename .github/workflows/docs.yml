name: Docs

on:
  push:
    branches: [main]
    paths:
      - "index.md"
      - "docs/**"
      - "spec/**"
      - "schema/**"
      - "Governance/**"
      - "PRIVACY.md"
      - "overrides/**"
      - "hooks/**"
      - "robots.txt"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "README.md"
      - "CHANGELOG.md"
      - "CONTRIBUTING.md"
      - "GOVERNANCE.md"
      - "CHARTER.md"
      - "ROADMAP.md"
      - "LIMITATIONS.md"
      - "CNAME"
      - "conformance/**"
      - ".github/workflows/docs.yml"
      - ".github/workflows/conformance-docs.yml"
  pull_request:
    paths:
      - 'conformance/**'
      - '.github/workflows/docs.yml'
      - '.github/workflows/conformance-docs.yml'
      - 'mkdocs.yml'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('docs-pr-{0}', github.ref) || 'docs-deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  conformance:
    permissions:
      contents: read
    uses: ./.github/workflows/conformance-docs.yml
  deploy:
    name: Build combined specification and conformance docs
    needs: conformance
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install docs dependencies
        run: |
          pip install --require-hashes -r requirements/docs.txt
          pip install --require-hashes -r requirements/dev.txt
          pip install --no-deps -e .

      - name: Configure git for gh-deploy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Assemble docs build directory
        run: |
          BUILD=.docs_build
          mkdir -p $BUILD

          if [ -d docs ]; then cp -r docs $BUILD/docs; fi
          if [ -d spec ]; then cp -r spec $BUILD/spec; fi
          if [ -d examples ]; then cp -r examples $BUILD/examples; fi
          if [ -d Governance ]; then cp -r Governance $BUILD/Governance; fi
          # schema/ carries pic-trace-bridge-v1.json, whose $id points at this
          # host. exclude_docs drops the three that are served from the apex.
          if [ -d schema ]; then cp -r schema $BUILD/schema; fi

          for fname in index.md CHANGELOG.md CONTRIBUTING.md GOVERNANCE.md CHARTER.md CODE_OF_CONDUCT.md MAINTAINERS.md SPONSORS.md ROADMAP.md LIMITATIONS.md PRIVACY.md CNAME robots.txt; do
            if [ -f "$fname" ]; then cp "$fname" "$BUILD/$fname"; fi
          done

          echo "Build dir contains $(find $BUILD -type f | wc -l) files"

      - name: Generate build config
        run: |
          sed 's|^docs_dir: \.$|docs_dir: .docs_build|' mkdocs.yml > .mkdocs_build.yml

      - name: Build specification documentation
        run: mkdocs build --clean --config-file .mkdocs_build.yml

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: conformance-docs
          path: site/conformance/

      - name: Verify combined site
        run: |
          rm -f site/conformance/CNAME
          test -s site/index.html
          test -s site/conformance/index.html
          test "$(cat site/CNAME)" = "trace.agentrust-io.com"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trace-combined-docs
          path: site/

      - name: Deploy combined site to GitHub Pages
        if: github.event_name != 'pull_request'
        run: ghp-import -n -p -f site
