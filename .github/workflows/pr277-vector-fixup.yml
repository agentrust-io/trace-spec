name: PR277 schema fixup
on:
  push:
    branches: [automation/pr277-runtime-evidence-fixup]
    paths: [.github/workflows/pr277-vector-fixup.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply reviewed schema patch
        run: |
          git apply --check .github/pr277-schema.patch
          git apply .github/pr277-schema.patch
          git diff --check
          test "$(git hash-object schema/trace-claim-v0.3-draft.json)" = 879106e98008b863d7c494d4593156d123aec0d6
      - name: Commit schema fixup
        run: |
          git config user.name "Louie Lu"
          git config user.email "48041247+lywinged@users.noreply.github.com"
          git add schema/trace-claim-v0.3-draft.json
          git commit -m "chore: materialize PR 277 schema fixup"
          git push
